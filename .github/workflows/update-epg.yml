name: Actualizar guía EPG combinada

on:
  schedule:
    # 08:00 UTC = 02:00 hora de Ciudad de México (UTC-6) todo el año.
    # Ajustá esta hora si te conviene otro horario.
    - cron: "0 8 * * *"
  workflow_dispatch: {}   # botón "Run workflow" para probarlo a mano

permissions:
  contents: write   # necesario para poder commitear guide.xml de vuelta al repo

concurrency:
  group: update-epg
  cancel-in-progress: false

jobs:
  update-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clonar iptv-org/epg (el grabber)
        run: git clone --depth 1 -b master https://github.com/iptv-org/epg.git epg-tool

      - name: Instalar dependencias del grabber
        working-directory: epg-tool
        run: npm install

      - name: Descargar guía de gatotv.com para mis canales
        working-directory: epg-tool
        run: |
          npm run grab -- \
            --channels=../channels/mis_canales_channels.xml \
            --output=../gatotv_guide.xml \
            --days=3

      - name: Descargar guía en vivo de m3u4u
        env:
          M3U4U_EPG_URL: ${{ secrets.M3U4U_EPG_URL }}
        run: |
          if [ -z "$M3U4U_EPG_URL" ]; then
            echo "Falta el secret M3U4U_EPG_URL en este repositorio (Settings → Secrets and variables → Actions)." >&2
            exit 1
          fi
          curl -fsSL "$M3U4U_EPG_URL" -o m3u4u_guide.xml

      - name: Combinar ambas guías en una sola
        run: |
          python3 scripts/merge_epg.py \
            --output guide.xml \
            --gzip \
            gatotv_guide.xml \
            m3u4u_guide.xml

      - name: Limpiar archivos intermedios
        run: rm -f gatotv_guide.xml m3u4u_guide.xml
        # guide.xml y guide.xml.gz sí se conservan y se commitean abajo.

      - name: Commitear y subir la guía combinada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add guide.xml guide.xml.gz
          if git diff --staged --quiet; then
            echo "Sin cambios en la guía hoy, no hay nada que commitear."
          else
            git commit -m "Actualiza guía EPG combinada [automático]"
            git push
          fi
